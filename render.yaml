# ── Baymax-Shoppey BACKEND (Fastify) → Render ─────────────────────────
# Frontend (Next.js) stays on Vercel and proxies /api/* here via API_ORIGIN.
services:
  - type: web
    name: baymax-shoppey-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Required
      - key: SUPABASE_URL
        value: https://opcdbpbnhabdcqkfrjrt.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # paste sb_secret_… from Supabase dashboard
      - key: OWNER_PASSWORD_HASH
        sync: false          # bcrypt hash — generate: npm run hash -- "your-password"
      - key: APP_URL
        value: https://baymax-shoppey.vercel.app
      - key: NODE_ENV
        value: production
      # Shared with Vercel so the daily cron ping (/api/cron/tick) passes auth
      - key: CRON_SECRET
        value: aeae5ec65e3df97a3d28b47e26c135c38648b8ed990f35dc
      # AI: Groq thinks (primary), Gemini free text is the fallback
      - key: AI_PRIMARY
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Agnes AI: ad image + image-to-video (free models)
      - key: AGNES_API_KEY
        sync: false
      # Posting times + 12-min keep-alive (Render sets RENDER_EXTERNAL_URL itself)
      - key: TZ
        value: Africa/Lagos
      - key: KEEPALIVE_MINUTES
        value: "12"
      # Social OAuth (optional until you connect accounts)
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
