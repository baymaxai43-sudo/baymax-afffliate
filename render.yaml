# Optional: deploy ONLY the Fastify API on Render (web service)
# Frontend stays on Vercel (baymax-shoppey.vercel.app) and points API_ORIGIN here.
services:
  - type: web
    name: baymax-shoppey-api
    runtime: docker
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_URL
        value: https://baymax-shoppey.vercel.app
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
